  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #080808; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; cursor: none; transition: background-color 0.5s ease, color 0.5s ease; }
    .skip-link { position: fixed; top: -100%; left: 1rem; z-index: 99999; background: #fff; color: #080808; padding: 0.5rem 1rem; font-size: 0.9rem; font-weight: 600; border-radius: 0 0 4px 4px; text-decoration: none; transition: top 0.2s; }
    .skip-link:focus { top: 0; }
    a:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 2px solid #fff; outline-offset: 3px; border-radius: 2px; }
    
    .reveal {
      opacity: 0;
      transform: translateY(40px);
      will-change: transform, opacity;
    }

    /* ── CURSOR & AURA GLOW ── */
    #cursor-dot { position: fixed; pointer-events: none; z-index: 10002; width: 8px; height: 8px; border-radius: 50%; background: #fff; transform: translate(-50%, -50%); transition: opacity 0.3s, transform 0.2s, width 0.2s, height 0.2s, background-color 0.5s; mix-blend-mode: difference; }
    #cursor-ring { position: fixed; pointer-events: none; z-index: 10001; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.35); transform: translate(-50%, -50%); transition: opacity 0.3s, width 0.2s, height 0.2s, border-color 0.5s; mix-blend-mode: difference; }
    #cursor-dot.hover { transform: translate(-50%, -50%) scale(1.8); }
    #cursor-ring.hover { width: 56px; height: 56px; }
    
    #cursor-glow { 
      position: fixed; pointer-events: none; z-index: 10000; width: 600px; height: 600px; border-radius: 50%; 
      transform: translate(-50%, -50%); 
      background: radial-gradient(circle at 30% 30%, rgba(255, 68, 68, 0.08) 0%, transparent 50%),
                  radial-gradient(circle at 70% 70%, rgba(80, 120, 200, 0.06) 0%, transparent 50%);
      filter: blur(40px); opacity: 0; transition: opacity 0.4s; will-change: left, top;
      animation: glowSpin 8s linear infinite;
    }
    #cursor-glow.active { opacity: 1; }
    @keyframes glowSpin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }

    /* ── VIDEO BACKGROUND ── */
    .bg-video-wrap { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .bg-video-wrap video { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; transition: opacity 0.5s ease; }
    .bg-video-wrap::after { content: ""; position: absolute; inset: 0; background: rgba(8, 8, 8, 0.75); pointer-events: none; transition: background-color 0.5s ease; }

    /* ── NOISE ── */
    body::before { content: ""; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E"); background-size: 200px; pointer-events: none; z-index: 999; opacity: 0.4; }

    .page-wrap { position: relative; z-index: 2; }

    /* ── NAV ── */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 1rem 3rem; display: flex; align-items: center; justify-content: space-between; transition: background 0.3s, border-bottom 0.3s; }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .nav-logo { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 1.1rem; color: #fff; letter-spacing: -0.03em; text-decoration: none; cursor: none; }
    .nav-logo span { color: rgba(255, 255, 255, 0.4); font-size: 0.72rem; font-weight: 400; display: block; letter-spacing: 0.12em; text-transform: uppercase; margin-top: 1px; }
    .nav-cta { background: #fff; color: #000; border: none; border-radius: 9999px; padding: 0.5rem 1.25rem; font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 500; cursor: none; letter-spacing: 0.05em; text-transform: uppercase; transition: opacity 0.2s, transform 0.2s; }
    .nav-cta:hover { opacity: 0.85; transform: translateY(-2px); }

    /* ── FLOATING CONTROL DOCK (GLASSMORPHISM) ── */
    .floating-dock {
      position: fixed; bottom: 2rem; right: 2.5rem; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; gap: 0.5rem; padding: 0.75rem 0.5rem;
      border-radius: 9999px; background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      transition: all 0.5s ease;
    }
    .dock-btn {
      background: transparent; border: none; color: #fff; font-family: 'Inter', sans-serif;
      font-size: 0.85rem; font-weight: 600; cursor: none; width: 44px; height: 44px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      transition: background 0.3s, transform 0.2s; opacity: 0.8;
    }
    .dock-btn:hover { background: rgba(255, 255, 255, 0.15); opacity: 1; transform: scale(1.05); }
    .dock-divider { width: 24px; height: 1px; background: rgba(255, 255, 255, 0.2); margin: 0.2rem 0; }
    
    .vol-track { width: 4px; height: 60px; background: rgba(255,255,255,0.2); border-radius: 2px; margin: 0.5rem 0; position: relative; cursor: none; }
    .vol-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; background: #fff; border-radius: 2px; pointer-events: none; transition: height 0.1s; }
    .vol-hitbox { position: absolute; inset: -15px; cursor: none; }

    section { padding: 6rem 3rem; position: relative; }
    .section-label { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255, 255, 255, 0.35); font-weight: 400; margin-bottom: 1rem; }
    .section-title { font-family: 'Inter', sans-serif; font-weight: 800; font-style: italic; font-size: clamp(2.5rem, 6vw, 5rem); line-height: 0.92; letter-spacing: -0.04em; color: #fff; margin-bottom: 3rem; }

    /* ── FILTER BUTTONS ── */
    .filter-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem; margin-top: 3rem; margin-bottom: 1rem; }
    .filter-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.6); padding: 0.6rem 1.4rem; border-radius: 9999px; font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; cursor: none; transition: all 0.3s ease; backdrop-filter: blur(10px); }
    .filter-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; border-color: rgba(255, 255, 255, 0.3); }
    .filter-btn.active { background: #fff; color: #080808; border-color: #fff; box-shadow: 0 0 15px rgba(255, 255, 255, 0.3); }

    /* ── 3x3 GRID SOLID COLORS ── */
    .archive-grid { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3rem; }
    .work-card-horizontal { height: 400px; display: flex; flex-direction: column; gap: 1.5rem; position: relative; cursor: none; width: 100%; }
    .work-card-horizontal .lando-label { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255, 255, 255, 0.5); font-weight: 600; z-index: 2; }
    .work-card-horizontal .lando-img-wrap { flex: 1; position: relative; overflow: hidden; border-radius: 12px; }
    .work-card-horizontal .work-bg, .work-card-horizontal .work-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
    .work-card-horizontal:hover .work-bg, .work-card-horizontal:hover .work-img { transform: scale(1.05); }

    /* ── CROSS-DOCUMENT VIEW TRANSITIONS ── */
    @view-transition {
      navigation: auto;
    }

    ::view-transition-group(root) {
      animation-duration: 0.8s !important;
    }
    ::view-transition-old(root) {
      animation: fade-out 0.8s cubic-bezier(0.16, 1, 0.3, 1) both !important;
    }
    ::view-transition-new(root) {
      animation: fade-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) both !important;
    }

    ::view-transition-group(project-thumb) {
      animation-duration: 0.8s !important;
      animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    #cursor-label {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
      color: #fff; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em;
      text-transform: uppercase; white-space: nowrap; opacity: 0; pointer-events: none; transition: none; z-index: 10003;
    }

    @media (max-width: 1024px) { .archive-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 650px) { .archive-grid { grid-template-columns: 1fr; } }
    
    .nav-controls { display: flex; align-items: center; gap: 0.5rem; }
    .nav-audio-group { display: flex; align-items: center; gap: 0.4rem; position: relative; }
    .vol-track-h { 
      width: 0px; height: 3px; background: rgba(255, 255, 255, 0.15); 
      border-radius: 99px; position: relative; cursor: none;

    }
    .nav-audio-group:hover .vol-track-h { width: 80px; opacity: 1; margin-right: 0.5rem; }
    .vol-track-h::after {
      content: attr(data-pct); position: absolute; right: -25px; top: 50%;
      transform: translateY(-50%); font-size: 0.65rem; font-weight: 700;
      color: #fff; opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .nav-audio-group:hover .vol-track-h::after { opacity: 0.6; }
    .vol-fill-h { position: absolute; top: 0; left: 0; height: 100%; width: 50%; background: #fff; border-radius: 99px; pointer-events: none; }
    .vol-hitbox-h { position: absolute; inset: -10px -5px; cursor: none; z-index: 2; }
    .dock-btn { 
      background: transparent; border: none; color: rgba(255, 255, 255, 0.6); 
      font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 500;

      justify-content: center; transition: color 0.3s, transform 0.2s;

    .dock-btn:hover { color: #fff; transform: translateY(-1px); }

    .btn-outline { border-radius: 9999px; padding: 0.75rem 1.75rem; font-family: 'Inter', sans-serif; font-size: 0.875rem; font-weight: 400; color: rgba(255, 255, 255, 0.7); background: transparent; border: 1px solid rgba(255, 255, 255, 0.15); cursor: none; letter-spacing: 0.02em; transition: border-color 0.3s, color 0.3s; }
    .btn-outline:hover { border-color: rgba(255, 255, 255, 0.4); color: #fff; }

    [data-i18n] { transition: opacity 0.3s ease; }

    /* ════ LIGHT MODE OVERRIDES ════ */
    [data-theme='light'] body { background-color: #f8fafc !important; color: #060b14 !important; }
    [data-theme='light'] body::before { opacity: 0.15 !important; }
    [data-theme='light'] .section-title, [data-theme='light'] .nav-logo { color: #060b14 !important; }
    [data-theme='light'] .section-label, [data-theme='light'] .lando-label, [data-theme='light'] .nav-logo span { color: rgba(6, 11, 20, 0.7) !important; }
    [data-theme='light'] .dock-btn { color: #060b14 !important; }

    [data-theme='light'] .vol-track-h { background: rgba(6, 11, 20, 0.15) !important; }

    [data-theme='light'] #cursor-dot { background: #060b14 !important; width: 5px; height: 5px; mix-blend-mode: normal !important; }
    [data-theme='light'] #cursor-ring { border-color: #060b14 !important; width: 24px; height: 24px; mix-blend-mode: normal !important; }
    [data-theme='light'] #cursor-dot.hover { transform: translate(-50%, -50%) scale(1.4); }
    [data-theme='light'] #cursor-ring.hover { width: 44px; height: 44px; }
    
    [data-theme='light'] #cursor-glow {

    }

    [data-theme='light'] .btn-outline { color: #060b14 !important; border-color: rgba(6, 11, 20, 0.3) !important; }
    [data-theme='light'] .btn-outline:hover { border-color: #060b14 !important; }
    [data-theme='light'] .nav-cta { background: #060b14 !important; color: #f8fafc !important; }
    
    /* FIX NÚT FILTER LIGHT MODE */
    [data-theme='light'] .filter-btn { background: rgba(6, 11, 20, 0.05) !important; border-color: rgba(6, 11, 20, 0.2) !important; color: #060b14 !important; }
    [data-theme='light'] .filter-btn:hover { background: rgba(6, 11, 20, 0.12) !important; border-color: rgba(6, 11, 20, 0.4) !important; color: #000 !important; }
    [data-theme='light'] .filter-btn.active { background: #060b14 !important; color: #f8fafc !important; border-color: #060b14 !important; box-shadow: 0 0 15px rgba(6, 11, 20, 0.15) !important; }



    .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }
  </style>
</head>

  <script>
    // ════════════════════════════════════════
    // TRANSLATIONS (KHÔNG DỊCH BUTTON VÀ HEADLINE)
    // ════════════════════════════════════════
    // Do trang Archive ít desc nên ko cần file i18n phức tạp, chủ yếu giữ logic lang sync.
    let currentLang = localStorage.getItem('lang') || 'en';
    const langBtn = document.getElementById('lang-toggle');
    langBtn.textContent = currentLang === 'en' ? 'EN' : 'VN';
    langBtn.addEventListener('click', () => {
      currentLang = currentLang === 'en' ? 'vn' : 'en';
      localStorage.setItem('lang', currentLang);
      langBtn.textContent = currentLang === 'en' ? 'EN' : 'VN';
      // Fade transition code for any [data-i18n] if needed
    });

    // ════════════════════════════════════════
    // AUDIO MANAGER (SYNC QUA SESSION)
    // ════════════════════════════════════════
    const audioLight = new Audio('https://cdn.pixabay.com/audio/2022/05/27/audio_1808fbf07a.mp3');
    const audioDark = new Audio('https://cdn.pixabay.com/audio/2022/11/22/audio_febc508520.mp3');
    audioLight.loop = true; audioDark.loop = true;
    audioLight.crossOrigin = "anonymous"; audioDark.crossOrigin = "anonymous";
    
    // Đọc trạng thái từ localStorage/sessionStorage
    let currentTheme = localStorage.getItem('theme');
    if (!currentTheme) {
      currentTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      localStorage.setItem('theme', currentTheme);
    }
    
    let currentAudio = currentTheme === 'light' ? audioLight : audioDark;
    let targetVolume = parseFloat(sessionStorage.getItem('targetVolume'));
    if(isNaN(targetVolume)) targetVolume = 0.5;
    let isMuted = sessionStorage.getItem('isMuted') === 'true';
    let audioStarted = false;
    
    const audioToggle = document.getElementById('audio-toggle');
    const audioIcon = document.getElementById('audio-icon');
    const volTrack = document.getElementById('vol-track');
    const volFill = document.getElementById('vol-fill');
    
    const svgMute = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>`;
    const svgVol = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>`;

    function updateIcon() {
      if(!audioStarted) { audioIcon.innerHTML = svgMute; return; }
      audioIcon.innerHTML = (isMuted || targetVolume === 0) ? svgMute : svgVol;
    }

    function applyVolume(vol) {
      targetVolume = vol;
      if (volFill) gsap.to(volFill, { width: (vol * 100) + '%', duration: 0.4, ease: 'power2.out' });
      if (volTrack) volTrack.setAttribute('data-pct', Math.round(vol * 100) + '%');
      if(!isMuted && currentAudio && audioStarted) gsap.to(currentAudio, { volume: targetVolume, duration: 0.3, ease: 'none' });
      updateIcon();
    }

    function restoreAudio() {
      let savedTime = parseFloat(sessionStorage.getItem('audioTime')) || 0;
      let wasPlaying = sessionStorage.getItem('isPlaying') === 'true';
      currentAudio.currentTime = savedTime;
      currentAudio.volume = isMuted ? 0 : targetVolume;
      if (volFill) gsap.set(volFill, { width: (targetVolume * 100) + '%' });
      if (volTrack) volTrack.setAttribute('data-pct', Math.round(targetVolume * 100) + '%');
      
      if(wasPlaying) {
        currentAudio.play().then(() => {
          audioStarted = true; updateIcon();
        }).catch(() => {
          const startInteraction = () => {
             currentAudio.play().then(() => { audioStarted = true; updateIcon(); });
             window.removeEventListener('click', startInteraction);
             window.removeEventListener('scroll', startInteraction);
          };
          window.addEventListener('click', startInteraction);
          window.addEventListener('scroll', startInteraction);
        });
      } else {
        updateIcon();
      }
    }
    restoreAudio();

    window.addEventListener('beforeunload', () => {
      sessionStorage.setItem('audioTime', currentAudio.currentTime);
      sessionStorage.setItem('isPlaying', (!currentAudio.paused && audioStarted) ? 'true' : 'false');
      sessionStorage.setItem('targetVolume', targetVolume);
      sessionStorage.setItem('isMuted', isMuted);
    });

    let isDraggingVol = false;
    if (volTrack) {
      function calcVolume(e) {
        const rect = volTrack.getBoundingClientRect(); 
        const w = rect.width > 20 ? rect.width : 80;
        let x = e.clientX - rect.left;
        let pct = x / w; 
        pct = Math.max(0, Math.min(1, pct));
        if(isMuted && pct > 0) isMuted = false;
        applyVolume(pct);
      }
      volTrack.addEventListener('click', calcVolume);
      volTrack.addEventListener('mousedown', e => { isDraggingVol = true; calcVolume(e); });
      window.addEventListener('mousemove', e => { if(isDraggingVol) calcVolume(e); });
      window.addEventListener('mouseup', () => { isDraggingVol = false; });
    }

    audioToggle.addEventListener('click', () => {
      if(!audioStarted) { 
        currentAudio.volume = isMuted ? 0 : targetVolume;
        currentAudio.play().then(() => { audioStarted = true; updateIcon(); }).catch(()=>{}); 
        return; 
      }
      isMuted = !isMuted;
      if(isMuted) { gsap.to(currentAudio, { volume: 0, duration: 0.5 }); } 
      else { if(targetVolume === 0) targetVolume = 0.5; applyVolume(targetVolume); }
      updateIcon();
    });

    function switchThemeAudio(isLight) {
      if(!audioStarted) { currentAudio = isLight ? audioLight : audioDark; return; }
      const nextAudio = isLight ? audioLight : audioDark;
      const prevAudio = isLight ? audioDark : audioLight;
      currentAudio = nextAudio;
      
      if(isMuted) return;
      gsap.to(prevAudio, { volume: 0, duration: 1.5, onComplete: () => prevAudio.pause() });
      nextAudio.volume = 0; nextAudio.play().catch(()=>{});
      gsap.to(nextAudio, { volume: targetVolume, duration: 1.5 });
    }

    // ════════════════════════════════════════
    // CORE GLOBAL LOGIC
    // ════════════════════════════════════════
    (function () {
      const dot = document.getElementById('cursor-dot'); const ring = document.getElementById('cursor-ring'); const glow = document.getElementById('cursor-glow');
      const cLabel = document.getElementById('cursor-label');
      let mx = -300, my = -300, rx = -300, ry = -300, gx = -300, gy = -300; let rafId = null, needsUpdate = false;
      document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; dot.style.left = mx + 'px'; dot.style.top  = my + 'px'; glow.classList.add('active'); needsUpdate = true; if (!rafId) rafId = requestAnimationFrame(tick); });
      document.addEventListener('mouseleave', () => glow.classList.remove('active'));
      document.querySelectorAll('a, button, .mag-btn, .nav-cta, .dock-btn, .vol-track').forEach(el => { el.addEventListener('mouseenter', () => { ring.classList.add('hover'); dot.classList.add('hover'); }); el.addEventListener('mouseleave', () => { ring.classList.remove('hover'); dot.classList.remove('hover'); }); });
      
      // Project Label & Navigation
      document.querySelectorAll('[data-label]').forEach(el => {
        el.addEventListener('mouseenter', () => { if(cLabel) { cLabel.textContent = el.dataset.label; gsap.to(cLabel, { opacity: 1, scale: 1, duration: 0.3 }); } });
        el.addEventListener('mouseleave', () => { if(cLabel) { gsap.to(cLabel, { opacity: 0, scale: 0.8, duration: 0.3 }); } });
      });

      window.navigateToDetail = function(card, id) {
        const thumb = card.querySelector('.lando-img-wrap') || card;
        thumb.style.viewTransitionName = 'project-thumb';
        sessionStorage.setItem('_vtProjectId', id);
        window.location.href = `project-detail.html?id=${id}`;
      };

      function tick() { rx += (mx - rx) * 0.18; ry += (my - ry) * 0.18; gx += (mx - gx) * 0.07; gy += (my - gy) * 0.07; ring.style.left = rx + 'px'; ring.style.top = ry + 'px'; glow.style.left = gx + 'px'; glow.style.top = gy + 'px'; rafId = (Math.abs(mx - rx) < 0.5 && Math.abs(my - ry) < 0.5 && Math.abs(mx - gx) < 0.5 && Math.abs(my - gy) < 0.5) ? null : requestAnimationFrame(tick); }
      document.addEventListener('visibilitychange', () => { if (document.hidden && rafId) { cancelAnimationFrame(rafId); rafId = null; } else if (!document.hidden && needsUpdate && !rafId) rafId = requestAnimationFrame(tick); });
    })();

    // THEME & VIDEO MANAGER
    (function () {
      const themeToggle = document.getElementById('theme-toggle'); const themeIcon = document.getElementById('theme-icon'); const video = document.getElementById('bg-video');
      const metaThemeColor = document.getElementById('meta-theme-color');
      const darkVideoSrc = 'https://stream.mux.com/Aa02T7oM1wH5Mk5EEVDYhbZ1ChcdhRsS2m1NYyx4Ua1g.m3u8';
      const lightVideoSrc = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260331_074327_a4d6275d-82d9-4c83-bfbe-f1fb2213c17c.mp4';
      let hlsInstance = null;

      function loadVideoForTheme(theme) {
        if (!video) return;
        const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (prefersReduced || (navigator.connection && navigator.connection.saveData)) { video.parentElement.style.display = 'none'; return; }
        video.style.opacity = '0';
        setTimeout(() => {
          if (theme === 'light') {
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            video.src = lightVideoSrc;
            if(metaThemeColor) metaThemeColor.setAttribute('content', '#f8fafc');
          } else {
            if (Hls.isSupported()) { hlsInstance = new Hls({ startLevel: -1, capLevelToPlayerSize: true }); hlsInstance.loadSource(darkVideoSrc); hlsInstance.attachMedia(video); } 
            else if (video.canPlayType('application/vnd.apple.mpegurl')) { video.src = darkVideoSrc; }
            if(metaThemeColor) metaThemeColor.setAttribute('content', '#080808');
          }
          video.play().then(() => { video.style.opacity = '0.85'; }).catch(() => {});
        }, 300);
      }

      document.documentElement.setAttribute('data-theme', currentTheme);
      themeIcon.textContent = currentTheme === 'dark' ? '☼' : '☾';
      loadVideoForTheme(currentTheme);

      themeToggle.addEventListener('click', () => {
        currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);
        localStorage.setItem('theme', currentTheme);
        themeIcon.textContent = currentTheme === 'dark' ? '☼' : '☾';
        loadVideoForTheme(currentTheme);
        switchThemeAudio(currentTheme === 'light');
      });
    })();

    // GSAP Reveal & Filters
    document.querySelectorAll('.reveal:not(.work-card-horizontal)').forEach(el => { 
      gsap.fromTo(el, { opacity: 0, y: 40 }, { 
        opacity: 1, y: 0, duration: 1, ease: 'power3.out', 
        scrollTrigger: { trigger: el, start: 'top 90%', toggleActions: 'play none none none' } 
      }); 
    });

    // Staggered Grid Reveal
    ScrollTrigger.batch(".archive-grid .work-card-horizontal", {
      onEnter: batch => gsap.fromTo(batch, { opacity: 0, y: 60 }, { 
        opacity: 1, y: 0, duration: 1.2, ease: 'power4.out', stagger: 0.15, overwrite: true 
      }),
      start: 'top 90%'
    });
    const filterBtns = document.querySelectorAll('.filter-btn'); const items = document.querySelectorAll('.filter-item');
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active')); btn.classList.add('active');
        const filterValue = btn.getAttribute('data-filter');
        items.forEach(item => { 
          const category = item.getAttribute('data-category'); 
          if (filterValue === 'all' || filterValue === category) { 
            gsap.to(item, { 
              display: 'flex', // Grid children are flex-column in our CSS
              scale: 1, 
              opacity: 1, 
              duration: 0.4, 
              ease: 'power2.out',
              overwrite: 'auto'
            }); 
          } else { 
            gsap.to(item, { 
              scale: 0.9, 
              opacity: 0, 
              duration: 0.4, 
              ease: 'power2.out', 
              display: 'none',
              overwrite: 'auto'
            }); 
          } 
        });
        setTimeout(() => ScrollTrigger.refresh(), 450);
      });
    });
  </script>
</body>
</html>
